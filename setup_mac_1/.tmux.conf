# -------
# General
# -------

# allow mouse usage
set -g mouse on

# --------
# Mappings
# --------

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# reload tmux.conf
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Split vertically
bind v split-window -h

# Split horizontally
bind s split-window -v

# Resize panes using Prefix + H, J, K, L
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# -------
# Styling
# -------

# Set colors
set -g @main_col 'green'
set -g @border_col 'black'

# Make line between lines the same color
set -g pane-border-lines single
set -g pane-border-style 'fg=#{@border_col}'
set -g pane-active-border-style 'fg=#{@border_col}'

# Statusbar settings
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#{@main_col}'
set -g status-left '#S: '
set -g status-right ''

# Windows settings
set -g window-status-format ' #I.#W '
set -g window-status-style 'fg=#{@main_col}'
set -g window-status-current-format '[#I.#W]'
set -g window-status-current-style 'fg=#{@main_col}'

# Message settings
set -g message-style 'fg=#{@main_col}'
